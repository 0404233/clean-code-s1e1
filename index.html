<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
  <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
</head>
<body class="body">
  <header class="hero">
    <img class="hero__img" src="./eisenhower-matrix.jpg" alt="Eisenhower Matrix illustration">
    <p class="hero__info">
      <a href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </p>
  </header>
  <main class="main">
    <section aria-labelledby="Add item" class="main__add-item">
      <h1 class="main__add-item_header">Add Item</h1>
      <form class="main__add-item__form">
        <input class="main__add-item__new-task" type="text" aria-label="New task">
        <button type="button" class="main__add-item__btn btn">Add</button>
      </form>
    </section>
    <section aria-labelledby="Todo tasks" class="main__todo">
      <h2 class="main__todo__header">Todo</h2>
      <ul class="tasks-list__incomplited-tasks tasks-list">
        <li class="tasks-list__task">
          <input type="checkbox" id="Pay Bills">
          <label for="Pay Bills">Pay Bills</label>
          <input type="text" aria-label="Edit task">
          <button class="edit-btn btn" aria-label="Edit task button">Edit</button>
          <button class="delete-btn btn" aria-label="Delete task button">
            <img src="./remove.svg" alt="Delete" class="delete-btn__img">
          </button>
        </li>
        <li class="edit-mode tasks-list__task">
          <input type="checkbox" id="go-shopping">
          <label for="go-shopping" class="edit-mode__content">Go Shopping</label>
          <input type="text" value="Go Shopping" class="task" aria-label="Edit task">
          <button class="edit-btn btn" aria-label="Save task">Save</button>
          <button class="delete-btn btn" aria-label="Delete task">
            <img src="./remove.svg" alt="Delete" class="delete-btn__img">
          </button>
        </li>
      </ul>
    </section>
    <section aria-labelledby="main__completed-tasks">
      <h2 class="main__completed-tasks__header">Completed</h2>
      <ul class="tasks-list__completed-tasks tasks-list">
        <li class="tasks-list__task">
          <input type="checkbox" id="see-doctor" checked>
          <label for="see-doctor" aria-colcount="complited task">See the Doctor</label>
          <input type="text" aria-label="Edit task">
          <button class="edit-btn btn" aria-label="Edit task">Edit</button>
          <button class="delete-btn btn" aria-label="Delete task">
            <img src="./remove.svg" alt="Delete" class="delete-btn__img">
          </button>
        </li>
      </ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
